[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "malleable-server"
version = "0.1.0"
description = "Shared FastAPI server infrastructure for Malleable demos"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["malleable_server*"]
