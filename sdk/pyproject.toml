[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malleable"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
]

[project.scripts]
malleable = "malleable.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["malleable*"]
